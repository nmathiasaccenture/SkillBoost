spring.application.name=skillboost
server.port=8080

skillboost.exercises.path=classpath:exercises/
skillboost.judge.timeout-seconds=5
skillboost.judge.sandbox.enabled=true

# H2 file-based DB (survives restarts). AUTO_SERVER lets multiple connections share the file.
spring.datasource.url=jdbc:h2:file:./data/skillboost;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT. Replace jwt-secret in a real deployment. Must be at least 32 bytes for HS256.
skillboost.security.jwt-secret=change-me-in-production-this-must-be-at-least-32-bytes-long
skillboost.security.jwt-expiration-minutes=240

# First-admin bootstrap. Used only when no admin exists in the DB. Change after first login.
skillboost.admin.username=admin
skillboost.admin.password=changeme
skillboost.admin.email=admin@skillboost.local
